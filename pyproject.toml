[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tia-wincc-alarm-export"
version = "0.1.0"
description = "Führt mehrere WinCC/TIA-Portal-Störarchiv-Dateien (.rdb) chronologisch sortiert zu einer CSV-Datei zusammen."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thomas Schlangen" }]

[project.scripts]
tia-wincc-alarm-export = "tia_wincc_alarm_export.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tia_wincc_alarm_export"]
